<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Balance Quest — Learn Algebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
    --purple: #8b5cf6;
    --purple-dark: #6d28d9;
    --green: #10b981;
    --red: #ef4444;
    --dark: #0f172a;
    --muted: #64748b;
    --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #f1f5f9 100%);
    --card-bg: #ffffff;
}

* { box-sizing: border-box; touch-action: none; }
body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--dark); text-align: center; min-height: 100vh; user-select: none; }
h1, h2, h3, .equation-display { font-family: 'Outfit', sans-serif; }
header { background: linear-gradient(135deg, #7c3aed, #2563eb); color: white; padding: 20px; }
header h1 { margin: 0; font-size: 2rem; }

.game { max-width: 900px; margin: 20px auto; padding: 0 15px 40px; }
.card { background: var(--card-bg); border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.equation-display { font-size: 2.2rem; margin: 15px 0; font-weight: 700; color: var(--purple-dark); }

.balance-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
.scale-card { flex: 1; min-width: 280px; background: #f8fafc; border-radius: 20px; padding: 15px; border: 2px solid #e2e8f0; }
.scale { position: relative; height: 220px; margin-top: 10px; }

.beam { position: absolute; top: 150px; left: 10%; width: 80%; height: 10px; background: #475569; border-radius: 10px; }
.pivot { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 50px solid #64748b; }

.pan { position: absolute; top: 20px; width: 42%; min-height: 100px; padding: 8px; display: flex; align-items: flex-end; justify-content: center; flex-wrap: wrap; gap: 6px; border-bottom: 5px solid #94a3b8; border-radius: 0 0 12px 12px; }
.pan.left { left: 4%; } .pan.right { right: 4%; }

.block { width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; font-weight: 700; font-family: 'Outfit', sans-serif; box-shadow: 0 4px 8px rgba(0,0,0,0.15); cursor: grab; }
.x-block { background: linear-gradient(135deg, #a855f7, #7c3aed); }
.y-block { background: linear-gradient(135deg, #f472b6, #db2777); }
.weight-block { background: linear-gradient(135deg, #60a5fa, #2563eb); width: 38px; height: 38px; font-size: 15px; }

.bin { margin: 20px auto; width: 280px; min-height: 90px; border: 2px dashed #cbd5e1; border-radius: 16px; padding: 10px; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.bin.active { background: #fef2f2; border-color: var(--red); }
.inventory { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }

button { border: none; border-radius: 12px; padding: 12px 24px; margin: 5px; background: var(--purple); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
button.green { background: var(--green); }
button.secondary { background: var(--muted); }
.hidden { display: none !important; }
.message { min-height: 35px; margin-top: 15px; font-size: 1.1rem; font-weight: 600; }
.success { color: #059669; } .warning { color: #dc2626; }
</style>
</head>
<body>

<header>
    <h1>⚖️ Balance Quest</h1>
</header>

<div class="game">
<div class="card">
    <h2 id="levelTitle">Level 1</h2>
    <div id="instruction">Drag or Tap weight blocks into the bin!</div>
    <div id="equationDisplay" class="equation-display">3x + 1 = 10</div>

    <div id="balanceRow" class="balance-row"></div>

    <div id="bin" class="bin">
        <strong>🗑️ Drop or Tap Blocks Here</strong>
        <div id="inventory" class="inventory"></div>
    </div>

    <div class="controls">
        <button id="checkBtn" class="green hidden" onclick="checkSolve()">Check Solution</button>
        <button id="resetBtn" class="secondary" onclick="loadLevel()">Reset Level</button>
    </div>

    <div id="message" class="message"></div>
</div>
</div>

<script>
let level = 1;
let leftBlocks = [{type:'x'}, {type:'x'}, {type:'x'}, {type:'w', val:1}];
let rightBlocks = Array.from({length: 10}, () => ({type:'w', val:1}));
let binBlocks = [];

function render() {
    const row = document.getElementById("balanceRow");
    row.innerHTML = `
        <div class="scale-card">
            <div class="scale">
                <div class="pan left" id="pan-left"></div>
                <div class="pan right" id="pan-right"></div>
                <div class="beam"></div>
                <div class="pivot"></div>
            </div>
        </div>
    `;

    const leftPan = document.getElementById("pan-left");
    const rightPan = document.getElementById("pan-right");

    leftBlocks.forEach((b, i) => leftPan.appendChild(createBlockElem(b, 'left', i)));
    rightBlocks.forEach((b, i) => rightPan.appendChild(createBlockElem(b, 'right', i)));

    const inv = document.getElementById("inventory");
    inv.innerHTML = "";
    binBlocks.forEach(b => {
        const el = document.createElement("div");
        el.className = "block weight-block";
        el.innerText = "1";
        inv.appendChild(el);
    });

    checkState();
}

function createBlockElem(block, side, index) {
    const el = document.createElement("div");
    el.className = `block ${block.type === 'x' ? 'x-block' : 'weight-block'}`;
    el.innerText = block.type === 'x' ? 'x' : '1';

    if (block.type === 'w') {
        attachCustomPointerDrag(el, side, index);
    }
    return el;
}

function attachCustomPointerDrag(el, side, index) {
    el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        
        // Tap/click fallback
        let moved = false;
        const startX = e.clientX;
        const startY = e.clientY;

        const clone = el.cloneNode(true);
        clone.style.position = "fixed";
        clone.style.zIndex = "1000";
        clone.style.pointerEvents = "none";
        clone.style.left = `${e.clientX - 20}px`;
        clone.style.top = `${e.clientY - 20}px`;
        document.body.appendChild(clone);
        el.style.opacity = "0.3";

        function onPointerMove(ev) {
            if (Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5) {
                moved = true;
            }
            clone.style.left = `${ev.clientX - 20}px`;
            clone.style.top = `${ev.clientY - 20}px`;

            const bin = document.getElementById("bin").getBoundingClientRect();
            if (ev.clientX >= bin.left && ev.clientX <= bin.right && ev.clientY >= bin.top && ev.clientY <= bin.bottom) {
                document.getElementById("bin").classList.add("active");
            } else {
                document.getElementById("bin").classList.remove("active");
            }
        }

        function onPointerUp(ev) {
            window.removeEventListener("pointermove", onPointerMove);
            window.removeEventListener("pointerup", onPointerUp);
            document.body.removeChild(clone);
            el.style.opacity = "1";
            document.getElementById("bin").classList.remove("active");

            const bin = document.getElementById("bin").getBoundingClientRect();
            const droppedInBin = (ev.clientX >= bin.left && ev.clientX <= bin.right && ev.clientY >= bin.top && ev.clientY <= bin.bottom);

            // If tapped OR dragged into bin, execute removal
            if (!moved || droppedInBin) {
                removeWeight(side, index);
            }
        }

        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp);
    });
}

function removeWeight(side, index) {
    if (side === 'left') {
        binBlocks.push(leftBlocks.splice(index, 1)[0]);
    } else {
        binBlocks.push(rightBlocks.splice(index, 1)[0]);
    }
    render();
}

function checkState() {
    const leftW = leftBlocks.filter(b => b.type === 'w').length;
    const rightW = rightBlocks.filter(b => b.type === 'w').length;

    if (leftW === 0 && rightW === 9) {
        document.getElementById("equationDisplay").innerText = "3x = 9";
        document.getElementById("instruction").innerText = "Great! Both sides reduced cleanly. Click Check!";
        document.getElementById("checkBtn").classList.remove("hidden");
    } else {
        document.getElementById("equationDisplay").innerText = `3x ${leftW ? '+ ' + leftW : ''} = ${rightW}`;
        document.getElementById("checkBtn").classList.add("hidden");
    }
}

function checkSolve() {
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    document.getElementById("message").innerHTML = "<span class='success'>🎉 Correct! 3x = 9 → x = 3</span>";
}

function loadLevel() {
    leftBlocks = [{type:'x'}, {type:'x'}, {type:'x'}, {type:'w', val:1}];
    rightBlocks = Array.from({length: 10}, () => ({type:'w', val:1}));
    binBlocks = [];
    document.getElementById("message").innerText = "";
    render();
}

window.onload = loadLevel;
</script>

</body>
</html>
